name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: 安装 uv 和 Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: 安装工作区依赖
        run: uv sync --locked
      - name: 代码规范检查
        run: uv run ruff check .
      - name: 发布关键路径类型检查
        run: uv run pyright --project pyrightconfig.release.json
      - name: 运行测试
        run: uv run pytest -q
      - name: CLI 冒烟测试
        run: uv run coding-agent --help

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: 安装 uv 和 Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: 构建全部发行包
        run: uv build --all-packages
      - name: 检查版本一致性
        run: uv run python scripts/check_versions.py
