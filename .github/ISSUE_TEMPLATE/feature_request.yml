name: 功能建议
description: 建议新功能、体验改进或架构调整
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先描述需要解决的问题，而不仅是实现方案。影响公开接口、数据格式、Provider 或大型依赖的改动，应先讨论再提交 PR。

  - type: dropdown
    id: component
    attributes:
      label: 相关组件
      options:
        - CLI 与参数解析
        - Agent 运行循环
        - LLM Provider 与模型
        - 工具与 Shell
        - 会话与上下文压缩
        - TUI 与终端渲染
        - 设置、登录与凭据
        - 构建、打包与 CI
        - 文档与开发体验
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述具体使用场景、当前限制和受影响的用户。
      placeholder: 当我尝试……时，目前……，因此……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为；可以包含 CLI 示例、接口草图或交互流程。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 说明考虑过的替代方案、当前临时做法及其不足。

  - type: dropdown
    id: compatibility
    attributes:
      label: 兼容性影响
      options:
        - 无已知破坏性影响
        - 可能改变现有行为或输出
        - 可能改变配置、会话或持久化格式
        - 可能改变公开 Python API
        - 尚不确定
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 相关 Issue、其他项目的实现、截图、性能或安全考虑等。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 我愿意在实现前根据维护者反馈调整方案。
          required: true
