[project]
name = "coding-agent"
version = "0.1.0"
description = "交互式编程 Agent 应用"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agent-llm",
    "agent-core",
    "agent-tui",
]

[project.scripts]
coding-agent = "coding_agent.cli.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
agent-llm = { workspace = true }
agent-core = { workspace = true }
agent-tui = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
